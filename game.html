<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>#arcade</title>
  <meta name="description" content="a small asteroid arcade game by ocean.">
  <link rel="icon" type="image/png" href="assets/icons/favicon.png?v=20261006">
  <link rel="preload" as="image" href="assets/images/fondo.jpg">
  <link rel="stylesheet" href="css/style.css?v=20261006-arcade4">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body class="game-page" data-page-title="arcade" data-active-game="starfall">
  <div class="bg" style="background-image:url('assets/images/fondo.jpg')"></div>
  <div class="noise"></div>
  <div class="scanlines"></div>

  <main class="game-shell">
    <header class="page-header">
      <div>
        <p class="eyebrow">~/ocean/arcade</p>
        <h1 class="title" id="arcade-title">star<span>fall</span></h1>
      </div>
      <a class="back-link" href="index.html">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20z"/></svg>
        back to profile
      </a>
    </header>

    <div class="arcade-layout">
      <nav class="game-menu" aria-label="arcade games">
        <p class="game-menu-heading">select a game</p>
        <button class="game-menu-item" type="button" data-game="starfall" aria-pressed="true">
          <span class="game-menu-number">01</span><span><strong>starfall</strong><small>asteroid survival</small></span>
        </button>
        <button class="game-menu-item" type="button" data-game="aim" aria-pressed="false">
          <span class="game-menu-number">02</span><span><strong>aim lab</strong><small>precision practice</small></span>
        </button>
        <button class="game-menu-item" type="button" data-game="tetris" aria-pressed="false">
          <span class="game-menu-number">03</span><span><strong>blockfall</strong><small>stack the signal</small></span>
        </button>
        <button class="game-menu-item" type="button" data-game="snake" aria-pressed="false">
          <span class="game-menu-number">04</span><span><strong>snake</strong><small>collect & survive</small></span>
        </button>
        <button class="game-menu-item" type="button" data-game="breakout" aria-pressed="false">
          <span class="game-menu-number">05</span><span><strong>breakout</strong><small>crack the wall</small></span>
        </button>
        <button class="game-menu-item" type="button" data-game="invaders" aria-pressed="false">
          <span class="game-menu-number">06</span><span><strong>void patrol</strong><small>defend the signal</small></span>
        </button>
        <button class="game-menu-item" type="button" data-game="dodge" aria-pressed="false">
          <span class="game-menu-number">07</span><span><strong>last light</strong><small>dodge the debris</small></span>
        </button>
      </nav>

      <div class="arcade-stage">
        <section class="game-panel" aria-label="arcade game">
          <div class="game-hud" aria-label="game stats">
            <span><span id="game-score-label">score</span> <strong id="game-score">0</strong></span>
            <span><span id="game-lives-label">lives</span> <strong id="game-lives">3</strong></span>
            <span id="game-level-group" hidden>level <strong id="game-level">1</strong></span>
            <span>best <strong id="game-best">0</strong></span>
            <button class="game-pause" id="game-pause" type="button" disabled>pause</button>
          </div>

          <canvas class="game-screen" id="game-canvas" width="1200" height="700" tabindex="0" role="application" aria-label="arcade game canvas"></canvas>
          <p class="game-mobile-hint" id="game-mobile-hint">tap start · drag to steer · hold fire · pause above</p>
          <div class="game-touch-controls" id="game-touch-controls" aria-label="touch game controls">
            <button type="button" data-game-action="left" aria-label="move left">←</button>
            <button type="button" data-game-action="up" aria-label="move up">↑</button>
            <button type="button" data-game-action="rotate" aria-label="rotate">rotate</button>
            <button type="button" data-game-action="down" aria-label="move down">↓</button>
            <button type="button" data-game-action="right" aria-label="move right">→</button>
            <button type="button" data-game-action="drop" aria-label="drop piece">drop</button>
            <button type="button" data-game-action="fire" aria-label="fire">fire</button>
          </div>
          <p class="game-status" id="game-status" role="status" aria-live="polite">click the game to start.</p>
        </section>

        <footer class="game-footer">
          <a class="back-link" href="proyectos.html">
            view projects
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4 10.59 5.41 16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/></svg>
          </a>
          <span class="footer-copy">ocean.is-a.dev · built in the dark</span>
        </footer>
      </div>
    </div>
  </main>

  <script src="js/script.js?v=20261006-prefixes"></script>
  <script src="js/game.js?v=20261006-arcade4"></script>
  <script src="js/arcade.js?v=20261006-arcade4"></script>
</body>
</html>
